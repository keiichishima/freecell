<!DOCTYPE html>
<html lang="zh-Hans">
    <head>
        <meta charset="UTF-8">
        <meta name="AppleTitle" content="空当接龙帮助">
        <meta name="description" content="空当接龙偏好设置说明">
        <meta name="keywords" content="Freecell, preferences, automatically, stack, move, multiple, 偏好设置">
        <link rel="stylesheet" href="style.css">
        <title>空当接龙偏好设置</title>
    </head>
    <body>
        <img src="logos.png">&nbsp;
        <span style font-size=small>
            <a href="Freecell.html">空当接龙帮助</a>
        </span>
        <h1>偏好设置</h1>
        <p>
        Freecell 的偏好设置中有两个选项，可以让游戏更容易。
        </p>
        <div class="centering">
            <img src="preferences.png">
        </div>
        <dl>
            <dt>自动将牌移动到目标堆</dt>
            <dd>启用后，游戏中不再需要的牌在可用时会自动移动到目标堆。A 总会自动上堆；其他牌在后续不再需要时也会自动上堆。
            </dd>
            <dt>允许一次移动多张牌</dt>
            <dd>启用后，你只需两次点击就能在列与列之间移动多张牌。可移动数量与手动逐张移动一致，但能省去大量重复操作。</dd>
        </dl>
    </body>
</html>
