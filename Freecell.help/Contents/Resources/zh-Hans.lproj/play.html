<!DOCTYPE html>
<html lang="zh-Hans">
    <head>
        <meta charset="UTF-8">
        <meta name="AppleTitle" content="空当接龙帮助">
        <meta name="description" content="如何玩空当接龙">
        <meta name="keywords" content="Freecell, play, how to play, 玩法">
        <link rel="stylesheet" href="style.css">
        <title>玩空当接龙</title>
    </head>
    <body>
        <img src="logos.png">&nbsp;
        <span style font-size=small>
            <a href="Freecell.html">空当接龙帮助</a>
        </span>
        <h1>我该怎么玩？</h1>
        <p>
        进行一次移动很简单。先点击你要移动的牌（或位置），它会被高亮显示。然后点击目标位置，若符合规则就会完成移动。若你走错了，可以随时撤销任意步数。
        </p>
        <div class="media-block">
            <img src="move-start.png">
            <p>
            这里我们要把红桃 8 移到黑桃 9 上。此时第三列已被点击，底部那张牌被高亮显示。
            </p>
        </div>
        <div class="media-block">
            <img src="move-end.png">
            <p>
            现在点击了第二列，牌已经移动过去。你也可以点击上方任意一个空当格，把这张牌移到那里。
            </p>
        </div>
    </body>
</html>
