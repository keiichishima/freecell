    <body>
        <img src="logos.png">&nbsp;
        <span style font-size=small>
            <a href="Freecell.html">空当接龙帮助</a>
        </span>
        <h1>历史记录窗口</h1>
        <p>
        Freecell 会记录你赢过和输过的对局。你可以在空当接龙菜单中选择“历史记录”来查看列表。
        </p>
        <div class="centering">
            <img src="history.png">
        </div>
        <p>
        列表中每个局号只保留一条记录。所以如果你某一局输了，可以一直重试直到获胜，从而保持记录整洁。
        </p>
