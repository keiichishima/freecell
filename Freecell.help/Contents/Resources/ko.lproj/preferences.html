<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="AppleTitle" content="프리셀 환경설정">
        <meta name="description" content="프리셀 환경설정 사용 방법">
        <meta name="keywords" content="프리셀, preferences, automatically, stack, move, multiple, supermove">
        <link rel="stylesheet" href="style.css">
        <title>프리셀 환경설정</title>
    </head>
    <body>
        <img src="logos.png">&nbsp;
        <span style font-size=small>
            <a href="Freecell.html">프리셀 도움말</a>
        </span>
        <h1>환경설정</h1>
        <p>
        프리셀 환경설정에는 플레이를 더 쉽게 해주는 두 가지 옵션이 있습니다.
        </p>
        <div class="centering">
            <img src="preferences.png">
        </div>
        <dl>
            <dt>카드를 자동으로 스택으로 이동</dt>
            <dd>이 옵션을 켜면 게임 진행에 더 이상 필요하지 않은 카드가 가능해지는 즉시 스택으로 자동 이동됩니다. 에이스는 항상 스택으로 이동되며, 다른 카드도 나중에 필요하지 않을 때 자동으로 이동됩니다.</dd>
            <dt>여러 장 카드 이동 허용</dt>
            <dd>이 옵션을 사용하면 두 번의 클릭만으로 열 사이에 여러 장의 카드를 이동할 수 있습니다. 수동으로 옮길 수 있는 범위 안에서만 이동하지만, 반복 작업을 크게 줄여줍니다.</dd>
        </dl>
    </body>
</html>
