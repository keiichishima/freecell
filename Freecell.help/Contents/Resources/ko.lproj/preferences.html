    <p>
    <img src="logos.png"> &nbsp; <font face="Lucida Grande" size=2><a href="Freecell.html">프리셀 도움말</a></font>
    <p>
    <font face="Lucida Grande"><b>환경설정</b></font>
    <p>
    <font face="Lucida Grande">프리셀 환경설정에는 플레이를 더 쉽게 해주는 두 가지 옵션이 있습니다.</font>
    <p align=center>
    <img src="preferences.png">
    <dl>
      <dt><font face="Lucida Grande"><b>카드를 자동으로 스택으로 이동</b></font></dt>
      <dd><font face="Lucida Grande">이 옵션을 켜면 게임 진행에 더 이상 필요하지 않은 카드가 가능해지는 즉시 스택으로 자동 이동됩니다. 에이스는 항상 스택으로 이동되며, 다른 카드도 나중에 필요하지 않을 때 자동으로 이동됩니다.</font></dd>
      <dt><font face="Lucida Grande"><b>여러 장 카드 이동 허용</b></font></dt>
      <dd><font face="Lucida Grande">이 옵션을 사용하면 두 번의 클릭만으로 열 사이에 여러 장의 카드를 이동할 수 있습니다. 수동으로 옮길 수 있는 범위 안에서만 이동하지만, 반복 작업을 크게 줄여줍니다.</font></dd>
    </dl>
  </body>
