<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8">
        <meta name="AppleTitle" content="空當接龍說明">
        <meta name="description" content="空當接龍偏好設定說明">
        <meta name="keywords" content="Freecell, preferences, automatically, stack, move, multiple, 偏好設定">
        <link rel="stylesheet" href="style.css">
        <title>空當接龍偏好設定</title>
    </head>
    <body>
        <img src="logos.png">&nbsp;
        <span style font-size=small>
            <a href="Freecell.html">空當接龍說明</a>
        </span>
        <h1>偏好設定</h1>
        <p>
        Freecell 的偏好設定中有兩個選項，可以讓遊戲更容易。
        </p>
        <div class="centering">
            <img src="preferences.png">
        </div>
        <dl>
            <dt>自動將牌移動到目標堆</dt>
            <dd>啟用後，遊戲中不再需要的牌在可用時會自動移動到目標堆。A 總會自動上堆；其他牌在後續不再需要時也會自動上堆。
            </dd>
            <dt>允許一次移動多張牌</dt>
            <dd>啟用後，你只需兩次點擊就能在列與列之間移動多張牌。可移動數量與手動逐張移動一致，但能省去大量重複操作。</dd>
        </dl>
    </body>
</html>
