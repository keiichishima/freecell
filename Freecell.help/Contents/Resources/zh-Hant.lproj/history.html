<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8">
        <meta name="AppleTitle" content="空當接龍說明">
        <meta name="description" content="空當接龍對局歷史記錄">
        <meta name="keywords" content="Freecell, history, 歷史記錄">
        <link rel="stylesheet" href="style.css">
        <title>空當接龍歷史記錄視窗</title>
    </head>
    <body>
        <img src="logos.png">&nbsp;
        <span style font-size=small>
            <a href="Freecell.html">空當接龍說明</a>
        </span>
        <h1>歷史記錄視窗</h1>
        <p>
        Freecell 會記錄你贏過和輸過的對局。你可以在空當接龍選單中選擇「歷史記錄」來查看清單。
        </p>
        <div class="centering">
            <img src="history.png">
        </div>
        <p>
        清單中每個局號只保留一條記錄。所以如果你某一局輸了，可以一直重試直到獲勝，從而保持記錄整潔。
        </p>
    </body>
</html>
