<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="AppleTitle" content="フリーセルの環境設定">
        <meta name="description" content="環境設定の使い方">
        <meta name="keywords" content="Freecell, フリーセル, preferences, 環境設定, automatically, 自動, stack, カード置き場, move, 動かす, multiple, 複数, supermove">
        <link rel="stylesheet" href="style.css">
        <title>環境設定</title>
    </head>
    <body>
        <img src="logos.png">&nbsp;
        <span style font-size=small>
            <a href="Freecell.html">フリーセルのヘルプ</a>
        </span>
        <h1>環境設定</h1>
        <p>
        環境設定では、ゲームを楽に進めることができるように、次の2つの設定をすることができます。
        </p>
        <div class="centering">
            <img src="preferences.png">
        </div>
        <dl>
            <dt>カードを自動的にカード置き場に移動</dt>
            <dd>ゲームに必要なくなったカードを自動的に右上のカード置き場に動かします。例えば、エースは必ずカード置き場に動かされます。その他のカードも、ゲームと関係なくなったときに自動的に動かされます。</dd>
            <dt>複数のカードの同時移動</dt>
            <dd>複数のカードをある列から別の列に動かすことができます。もちろん、一枚ずつ動かすこともできますが、それは大変です。</dd>
        </dl>
    </body>
</html>
